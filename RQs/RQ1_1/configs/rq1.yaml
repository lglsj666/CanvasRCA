schema_version: CanvasRCARQ1_1ConfigV3
protocol_revision: rq1_1_v14_full_480_rerun_budget_registration
status: smoke_qualified_formal_authorized_active_only
execution_enabled: true
seed: 42

unified:
  vllm: configs/vllm_inference.yaml
  segmentation: configs/dataset_segmentation.yaml
  scorer: configs/rca_scorer.yaml

renderer:
  owner: RQ1_1
  inherited_from: RQs/RQ1/src/renderer
  preset: rq0_v6
  required_version: 14
  overrides:
    topology_edge_key: identity_horizontal
    topology_edge_columns: 2
    uniform_detail_font_pt: 9.5
    canvas_aspect: 0.76
    entity_label_mode: case_local_ids
    show_entity_id_explanation: true

external_methods:
  react:
    repository: https://github.com/ysymyth/ReAct
    commit: 6bdb3a1fd38b8188fc7ba4102969fe483df8fdc9
    local_path: packages/ReAct
    runtime_dependency: false
  denum:
    repository: https://github.com/gaiusyu/Denum
    commit: a3a697564e378643461e27ab92ea44b098424c35
    local_path: packages/Denum
    runtime_dependency: false
    graph_schema: DenumReadableLogGraphV1
    text_schema: DenumLogTextV1
    visual_schema: DenumLogVisualRowsV1
    binary_output: false
    relative_bins: 64
    visible_template_limit: 8
    tool_row_limit: 20
    tool_character_limit: 12000

experiments:
  direct_rca:
    task: direct_rca
    status: active
    model_calls_per_case_arm: 1
    arms: [T, MV, TCV, LV, TPV, V_MR, V_ML, V_MG, V_RL, V_RG, V_LG, V_MRL, V_MRG, V_MLG, V_RLG, V, C, S, H]
    primary_metric: mrr
  direct_qa:
    task: direct_qa
    status: active
    model_calls_per_case_arm: 1
    arms: [L1_T, L1_V, L1_S, L1_PATHV, L1_CONTEXTV,
           L2_T, L2_V, L2_S, L2_PATHV, L2_CONTEXTV,
           L3_T, L3_V, L3_S, L3_PATHV, L3_CONTEXTV,
           L4_T, L4_V, L4_S]
    perception_difficulties: [1, 2, 3, 4]
    reasoning_difficulties: [1, 2, 3]
    reasoning_families: [parallel_direct_lookup, dependent_entity_bridge, compare_and_aggregate]
    maximum_template_counts: {P1: 12, P2: 36, P3: 72, P4: 72}
    selection_policy: roster_balanced_visible_eligibility_v1
    visibility_contract:
      exclude_metric_label_elision: true
      exclude_unprinted_entry_or_edge_index: true
      exclude_missing_or_absent_answer_values: true
      require_public_support_for_every_step: true
      require_same_question_across_models_and_conditions: true
      selection_uses_model_responses: false
      inferential_unit: case
    historical_qa_protocol:
      status: superseded_after_v3_full_corpus_regeneration
      names: [balanced_positive_extension, visibility_clean_l4_extension]
    primary_metric: complete_chain_accuracy
  one_stage_counterfactual_rca:
    task: counterfactual_rca
    status: qualification_pending_rq2_completion
    model_calls_per_case_arm: 1
    arms: [V_FACTUAL, V_TARGETED, V_PLACEBO, V_NEUTRAL]
    primary_metric: mrr
    roster_scope: full_480_after_v3_regeneration
  multi_stage_rca:
    task: multi_stage_rca
    status: abandoned
    abandonment_scope: future_work_only
    steps: 3
    model_calls_per_step: 2
    model_calls_per_case_arm: 6
    arms: [T, V, S, LV, MV, TCV, TPV]
    tools: [search_metrics, search_traces, search_logs, search_topology]
    primary_metric: mrr

data:
  allowed_datasets: [aegislab, aiops2022, aiops2025, re2_ob, re2_tt]
  smoke_datasets: [re2_ob, aiops2022, aiops2025]
  frozen_source_manifest: RQs/RQ1_1/configs/rosters/case_manifest_480_frozen_v1.json
  private_roster: RQs/RQ1_1/configs/rosters/rq1_frozen_eval_480_private_v3.json
  public_roster: RQs/RQ1_1/configs/rosters/rq1_frozen_eval_480_public_v3.json
  roster_status: materialized_from_complete_v3_corpus
  exact_counts: {aegislab: 100, aiops2022: 100, aiops2025: 100, re2_ob: 90, re2_tt: 90}
  headline_datasets: [aegislab, aiops2022, aiops2025]
  saturated_diagnostic_datasets: [re2_ob]
  final_ood_datasets: [re2_tt]
  preparation_schema: CanvasRCAProcessedPublicCaseV3
  missing_case_policy: fail_closed

runtime:
  models: [qwen3.8-27b, gemma-4-26b-a4b]
  max_workers: 8
  request_concurrency: 36
  default_shard_count: 24
  result_root: RQs/RQ1_1/results
  smoke_call_cap_total: 18
  smoke_timeout_seconds_total: 600
  whole_case_infrastructure_exclusion_maximum: 0.05
  parse_rate_minimum: 0.95
  major_rq_call_cap: 40000
  registered_formal_calls_after_v3:
    direct_rca: 18240
    direct_qa: 17280
    one_stage_counterfactual_rca: 3840
    total: 39360

# Narrow compatibility rules for the 2026-09-05 QA anchor repair and the
# three-call Direct-RCA attention-completeness repair. A predecessor terminal
# is reusable only when its complete model-visible request and current private
# score are exactly reproducible; no merely similar prompt may pass.
resume_compatibility:
  direct_qa_predecessor_contract_sha256:
    - b5bb3acd5766e09693277cab5800219eb33fb5c32973d067643c38c143fbe697
  direct_rca_predecessor_contract_sha256:
    - b5bb3acd5766e09693277cab5800219eb33fb5c32973d067643c38c143fbe697
  policy: exact_model_visible_request_and_current_score_match_only

performance_metrics:
  schema: CanvasRCAPerformanceInstrumentationV1
  enabled: true
  sample_interval_s: 1.0
  request_metrics: [ttft_s, decode_time_s, tpot_s, receiver_e2e_s, output_tokens_per_s]
  run_metrics: [attempted_requests_per_s, goodput_requests_per_s, peak_vram_used_bytes,
                peak_kv_cache_usage_fraction, gpu_utilization_weighted_seconds,
                estimated_energy_joules]
  preparation_metrics: [total_s, stage_seconds]
  prefill_time_policy: unavailable_without_server_phase_trace
  stream_itl_policy: transport_chunk_proxy_only
  operational_only: true

smoke_plans:
  direct_rca:
    qwen3.8-27b:
      re2_ob: [T, C, MV]
      aiops2022: [LV, V_ML, V_MRG]
      aiops2025: [TCV, V_MG, V_MLG]
    gemma-4-26b-a4b:
      re2_ob: [TPV, V_RL, V_RLG]
      aiops2022: [V_RG, V_MRL, V]
      aiops2025: [V_LG, S, H]
    total_calls: 18
  direct_qa:
    qwen3.8-27b:
      re2_ob: [L1_T, L1_V, L1_S]
      aiops2022: [L1_PATHV, L1_CONTEXTV, L2_T]
      aiops2025: [L2_V, L2_S, L2_PATHV]
    gemma-4-26b-a4b:
      re2_ob: [L2_CONTEXTV, L3_T, L3_V]
      aiops2022: [L3_S, L3_PATHV, L3_CONTEXTV]
      aiops2025: [L4_T, L4_V, L4_S]
    total_calls: 18
  one_stage_counterfactual_rca:
    qwen3.8-27b:
      re2_ob: [V_FACTUAL, V_TARGETED]
      aiops2022: [V_PLACEBO]
      aiops2025: [V_NEUTRAL]
    gemma-4-26b-a4b:
      re2_ob: [V_FACTUAL]
      aiops2022: [V_TARGETED, V_PLACEBO]
      aiops2025: [V_NEUTRAL]
    total_calls: 8

inference_adapter:
  name: context_safe_output_v1
  version: 1
  max_tokens: 8192
  scope: all_rq1_1_models_arms_cases_and_stages

analysis:
  no_confidence_intervals: true
  paired_test: wilcoxon_pratt
  effect_size: paired_cohens_dz
  rca_minimum_effect: 0.05
  primary_rca_comparisons: [[V, T], [LV, T], [MV, T], [TCV, T], [TPV, T]]
  compact_text_comparisons: [[C, T], [V, C]]
  negative_control_comparison: [S, T]
  hybrid_control_comparison: [H, T]
  factorial_regions: [M, R, L, G]
  perception_rca_pairing: [model, opaque_incident_id, mapped_rca_arm]
  multi_stage_direct_comparison: abandoned
  holm_correction: true
  counterfactual_primary_metric: cvi
  counterfactual_minimum_effect: 0.05
