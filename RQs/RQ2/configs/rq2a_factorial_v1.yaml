schema_version: RQ2AFactorialConfigV1
experiment_id: rq2a_encoding_arrangement_factorial_v1
registered_description: RQs/RQ2/descriptions/rq2_master_protocol_v1.md
decision_authority: DD-35

execution:
  enabled: false
  stage: static_implementation_only
  inference_authorized: false

data:
  exposure_ledger_source: RQs/RQ1/configs/exposure_ledger_v2.json
  development:
    total: 60
    per_dataset: 20
    source: already_executed_exposed_rq1_cases
    selection_key: "42:rq2a:development:<dataset>:<private_case_id>"
  independent_gate:
    total: 150
    per_dataset: 50
    source: previously_unused_exposed_outside_all_frozen_rosters
    selection_key: "42:rq2a:gate:<dataset>:<private_case_id>"
    locked_before_development_inference: true
  downstream_development_lock:
    total: 90
    per_dataset: 30
  forbidden_partitions:
    - reserve
    - heldout
    - re2_tt
    - unknown
  locked_rq1_rosters_remain_unavailable: true

factorial:
  design: full_2_power_4
  expected_cells: 16
  factors:
    M:
      contribution_class: encoding
      minus: metric_binned_heatmap
      plus: metric_small_multiple_lines
    G:
      contribution_class: encoding
      minus: topology_node_link_directed
      plus: topology_edge_time_adjacency_matrix
    A:
      contribution_class: arrangement
      minus: cross_source_modality_blocked
      plus: cross_source_entity_aligned
    O:
      contribution_class: arrangement
      minus: entity_order_natural_public_id
      plus: entity_order_label_blind_salience
  exact_fact_inventory_equality: true
  identical_image_geometry_and_png_contract: true

label_blind_salience:
  schema_version: RQ2LabelBlindSalienceV1
  robust_z_cap: 99.9
  anomaly_threshold: 3.0
  degree_cap: 10
  weights:
    severity: 0.50
    persistence: 0.25
    source_coverage: 0.15
    topology_degree: 0.10
  tie_break: natural_public_id
  forbidden_inputs:
    - root_cause
    - ground_truth
    - accepted_aliases
    - fault_type
    - injection_time
    - dataset
    - private_answer
    - model_output
    - case_id
    - source_path

operations:
  primary:
    - temporal_composition
    - relational_composition
    - cross_source_alignment
    - missingness_uncertainty
  negative_control: exact_lookup
  derived_answers_model_visible: false
  inferential_unit: opaque_incident
  set_answer_order_semantics: order_insensitive_canonicalized_naturally

models:
  development:
    - tag: gemma-4-26b-a4b
      checkpoint: models/gemma-4-26B-A4B-it
      served_model_name: google/gemma-4-26B-A4B-it
      batch_invariant: true
  independent_gate:
    - tag: gemma-4-26b-a4b
      checkpoint: models/gemma-4-26B-A4B-it
      served_model_name: google/gemma-4-26B-A4B-it
      batch_invariant: true
    - tag: qwen3.6-27b
      checkpoint: models/Qwen3.6-27B
      served_model_name: Qwen/Qwen3.6-27B
      batch_invariant: false

inference:
  backend: vllm
  dtype: bfloat16
  quantization: null
  max_model_len: 32768
  max_tokens: 16384
  temperature: 0.0
  top_p: 1.0
  seed: 42
  thinking: false
  enforce_eager: true
  enable_prefix_caching: false
  enable_chunked_prefill: false
  gpu_memory_utilization: 0.65
  request_timeout_s: 1800

gates:
  development:
    target_family_main_effect_minimum: 0.10
    repairs_must_exceed_breaks: true
    exact_lookup_degradation_strictly_above: -0.05
    per_dataset_harm_floor_exclusive: -0.10
    parse_rate_minimum: 0.95
    paired_infrastructure_exclusion_maximum: 0.05
    p_value_gate: false
    planning_paired_sd: 0.36
    approximate_mde: 0.130
  independent:
    target_family_main_effect_minimum: 0.10
    holm_adjusted_p_maximum_exclusive: 0.05
    primary_family_maximum: 4
    repairs_must_exceed_breaks: true
    exact_lookup_degradation_strictly_above: -0.05
    positive_dataset_minimum: 2
    per_dataset_harm_floor_exclusive: -0.10
    parse_rate_minimum: 0.95
    paired_infrastructure_exclusion_maximum: 0.05
    planning_mde_range: [0.082, 0.114]

qualification:
  exact_fact_parity: required
  leakage_and_ocr_audit: required
  answer_separation: required
  deterministic_render: required
  manual_reviews_per_dataset_minimum: 4
  partition_aware_smoke: required
  oracle_interface_check: required
  runtime_freeze: required
  source_directory_must_remain_empty: true
