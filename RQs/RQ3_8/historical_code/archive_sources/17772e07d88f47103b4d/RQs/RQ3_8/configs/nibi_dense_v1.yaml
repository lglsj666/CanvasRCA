schema_version: CanvasRCAVLLMInferenceConfigV11
protocol_version: rq38-nibi-dense-v1
status: pending_qualification
deployment:
  profile: nibi
  python: .venv-inference/bin/python
  vllm_bin: .venv-inference/bin/vllm
software: {python: '3.11', vllm: '0.24.0', transformers: '5.14.1', torch: '2.11.0'}
common:
