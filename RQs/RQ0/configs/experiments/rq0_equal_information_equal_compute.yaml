schema_version: 1
experiment: rq0_equal_information_equal_compute_v1
registered_plan: plans/2026-07-29_rq0_equal_information_equal_compute_plan.md
roster: RQs/RQ0/configs/partition_roster.json
exposure_ledger: RQs/RQ0/configs/exposure_ledger.json
seed: 42

evidence:
  schema: CanonicalEvidenceBundleV1
  renderer_preset: rq0_v6
  renderer_version: 6
  panel_budget: 12
  metric_time_bins: 64
  log_records: 8
  trace_records: 8
  propagation_services: 14
  arms:
    - visual_text_topology
    - text_only
    - flat_structured
  arm_orders: [ABC, ACB, BAC, BCA, CAB, CBA]

models:
  primary:
    tag: qwen3.6-27b
    checkpoint: /home/lglsj/CanvasRCA/models/Qwen3.6-27B
    served_model_name: Qwen/Qwen3.6-27B
  replication:
    tag: gemma-4-26b-a4b
    checkpoint: /home/lglsj/CanvasRCA/models/gemma-4-26B-A4B-it
    served_model_name: google/gemma-4-26B-A4B-it

vllm:
  dtype: bfloat16
  quantization: null
  tensor_parallel_size: 1
  max_model_len: 32768
  max_num_seqs: 8
  max_images_per_prompt: 8
  max_videos_per_prompt: 0
  gpu_memory_utilization: 0.65
  generation_config: vllm
  seed: 42
  async_scheduling: false
  enable_prefix_caching: false
  enable_chunked_prefill: false
  use_flashinfer_sampler: false
  batch_invariant: false
  cublas_workspace_config: ":4096:8"
  gdn_prefill_backend: triton
  moe_backend: triton
  triton_force_first_config: true
  enforce_eager: true
  trust_remote_code: true

protocol_amendments:
  - date: 2026-07-31
    before_formal_inference: true
    trigger: >-
      The registered CUDA-graph runtime failed the cross-process determinism
      gate even after asynchronous scheduling was disabled and deterministic
      Triton/cuBLAS settings were pinned.
    evidence:
      cuda_graph_cross_process_prediction_mismatches: 7
      cuda_graph_cross_process_mrr_mismatches: 2
      batch_invariant_attempt: >-
        Unsupported by vLLM 0.24.0 for Qwen3.6 GDN_ATTN; server initialization
        terminates with an explicit compatibility error.
      eager_same_process_pairs: 60
      eager_same_process_mismatches: 0
      eager_cross_process_pairs: 60
      eager_cross_process_mismatches: 0
    resolution: >-
      Use eager execution for both models and all three arms. This disables
      CUDA graphs but preserves the registered checkpoint, BF16 precision,
      prompts, CEB artifacts, token/output limits, decoding, and per-call
      inference opportunity. Runtime efficiency remains a reported outcome.

decoding:
  one_shot: true
  max_tokens: 16384
  temperature: 0.0
  top_p: 1.0
  seed: 42
  thinking: false
  timeout_s: 1800
  retry_attempts: 3

quality_gates:
  parse_rate_min: 0.95
  unpaired_infrastructure_rate_max: 0.01
  determinism_cases_min: 20
  static_fact_parity_required: true
  leakage_audit_required: true
  renderer_determinism_required: true

comparability_note: >-
  gpu_memory_utilization is an operational allocation ceiling. Historical
  differences in this value do not affect result validity or comparability;
  model, input, decoding, and successful completion define the inference result.
