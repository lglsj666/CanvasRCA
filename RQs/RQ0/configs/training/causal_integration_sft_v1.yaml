schema_version: 1
experiment: causal_integration_sft_v1
scope: development_only_nonconfirmatory_case_level_causal_integration_sft
seed: 42
source_partition_roster: RQs/RQ0/configs/partition_roster.json
source_partition: development
source_exposure_ledger: RQs/RQ0/configs/exposure_ledger.json
derived_roster: RQs/RQ0/configs/training/causal_integration_sft_v1_roster.json
artifact_root: RQs/RQ0/results/causal_integration_sft_v1/data
renderer_preset: rq0_v7_edge_key
heldout_fraction: 0.20
primary_datasets: [aegislab, aiops2022, aiops2025]
smoke_datasets: [re2_ob, aiops2022, aiops2025]
prior_diagnostic_roster: RQs/RQ0/results/rq0_v7_edge_key_case_integration_v1/artifacts/artifact_roster.json
eligibility:
  require_single_service_level_accepted_root: true
  require_root_in_candidates: true
  require_visible_root_evidence: true
  require_non_root_propagation_symptom: true
  prefer_caller_path_to_root: true
selection:
  pilot_train_per_primary_dataset: 8
  pilot_eval_per_primary_dataset: 4
model:
  path: models/Qwen3.6-27B
  checkpoint_lock: RQs/RQ0/configs/checkpoint_lock.json
  dtype: bfloat16
  quantization: null
  attention_implementation: flash_attention_2
  gdn_backend: flash-linear-attention-0.5.2
  causal_conv1d_backend: pytorch_fallback_no_local_nvcc
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_scope: all_language_layer_linear_projections
training:
  max_sequence_length: 16384
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_ratio: 0.10
  max_grad_norm: 1.0
  optimizer: adamw_torch_fused
  gradient_checkpointing: true
  seed: 42
  pilot_max_optimizer_steps: 6
  checkpoint_every_steps: 2
smoke:
  gradient_accumulation_steps: 3
  max_optimizer_steps: 1
  result_root: RQs/RQ0/results/causal_integration_sft_smoke_v1
  checkpoint_root: models/checkpoints/causal_integration_sft_smoke_v1
pilot:
  result_root: RQs/RQ0/results/causal_integration_sft_pilot_v1
  checkpoint_root: models/checkpoints/causal_integration_sft_pilot_v1
  best_root: models/best/causal_integration_sft_pilot_v1
  promotion_gate:
    minimum_macro_delta_mrr: 0.05
    minimum_parse_rate: 0.95
    maximum_dataset_reverse_delta_mrr: -0.10
    require_zero_infrastructure_failures: true
integrity:
  formal_cases_allowed: false
  reserve_cases_allowed: false
  train_ticket_allowed: false
  smoke_accuracy_is_gate: false
  smoke_loss_magnitude_is_gate: false
