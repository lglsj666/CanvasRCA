schema_version: 2
experiment: causal_integration_sft_v2
scope: development_only_nonconfirmatory_preservation_correction_pilot
seed: 42
source_v1_roster: RQs/RQ0/configs/training/causal_integration_sft_v1_roster.json
candidate_plan: RQs/RQ0/configs/training/causal_integration_sft_v2_candidate_plan.json
base_rollout_root: RQs/RQ0/results/causal_integration_sft_v2/base_rollouts/main
derived_roster: RQs/RQ0/configs/training/causal_integration_sft_v2_roster.json
artifact_root: RQs/RQ0/results/causal_integration_sft_v2/data
primary_datasets: [aegislab, aiops2022, aiops2025]
smoke_datasets: [re2_ob, aiops2022, aiops2025]
selection:
  fresh_eval_per_primary_dataset: 4
  pilot_train_per_role_per_primary_dataset: 6
  target_service_count: 5
model:
  path: models/Qwen3.6-27B
  checkpoint_lock: RQs/RQ0/configs/checkpoint_lock.json
  dtype: bfloat16
  quantization: null
  attention_implementation: flash_attention_2
  gdn_backend: flash-linear-attention-0.5.2
  causal_conv1d_backend: pytorch_fallback_no_local_nvcc
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_scope: all_language_layer_linear_projections
training:
  max_sequence_length: 16384
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00005
  weight_decay: 0.0
  warmup_ratio: 0.10
  max_grad_norm: 1.0
  optimizer: adamw_torch_fused
  gradient_checkpointing: true
  seed: 42
  pilot_max_optimizer_steps: 9
  checkpoint_every_steps: 3
smoke:
  gradient_accumulation_steps: 3
  max_optimizer_steps: 1
  result_root: RQs/RQ0/results/causal_integration_sft_smoke_v2
  checkpoint_root: models/checkpoints/causal_integration_sft_smoke_v2
pilot:
  result_root: RQs/RQ0/results/causal_integration_sft_pilot_v2
  checkpoint_root: models/checkpoints/causal_integration_sft_pilot_v2
  best_root: models/best/causal_integration_sft_pilot_v2
  evaluation_stage_partition: development_heldout_v2
  promotion_gate:
    minimum_macro_delta_mrr: 0.05
    minimum_parse_rate: 0.95
    maximum_dataset_reverse_delta_mrr: -0.10
    require_zero_infrastructure_failures: true
integrity:
  formal_cases_allowed: false
  reserve_cases_allowed: false
  train_ticket_allowed: false
  initialize_from_rejected_v1_adapter: false
  current_v1_eval_cases_allowed_for_selection: false
  smoke_accuracy_is_gate: false
  smoke_loss_magnitude_is_gate: false
