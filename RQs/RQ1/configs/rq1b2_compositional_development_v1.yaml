extends: rq1b_visops_mapping_v2.yaml
experiment_id: rq1b2_compositional_development_v1
registered_description: RQs/RQ1/descriptions/rq1b2_compositional_complexity_protocol_v1.md
power_and_gate: RQs/RQ1/descriptions/rq1b2_compositional_complexity_protocol_v1.md

execution:
  stage: rq1b2_exposed_answer_hidden_development_registered
  requires_smoke_qualification: true
  partial_result_policy: operational_health_only_no_tuning_or_early_stop

data:
  roster: RQs/RQ1/configs/rosters/rq1b2_development_public_v1.json
  private_roster: RQs/RQ1/configs/rosters/rq1b2_development_private_v1.json
  locked_gate_roster: RQs/RQ1/configs/rosters/rq1b2_gate_public_v1.json
  mapping_cases_per_dataset: 30
  mapping_case_total: 90
  mapping_gate_overlap: 0

contracts:
  renderer: RQ1VisualViewV5AnswerHidden
  answer_separation: required_no_derived_answer_fact_or_visual_highlight
  temporal_normalization:
    method: baseline_median_and_mad_robust_z
    block_count: 16
    display_precision_decimals: 1
    winsorized_abs_z_max: 99.9
    answer_preservation: cap_exceeds_abs_z_threshold_3_and_preserves_sign

visops:
  task_profile: answer_hidden_compositional_v1
  operation_families:
    exact_lookup:
      - metric_exact_lookup
    temporal_scanning: []
    topology_path: []
    cross_modal_alignment: []
    missingness_uncertainty: []
    answer_hidden_temporal_composition:
      - raw_temporal_onset_low
      - raw_temporal_onset_high
    answer_hidden_relational_composition:
      - directed_shortest_path_low
      - directed_shortest_path_high

gates:
  rq1b_visops_mapping:
    status: failed_preserved_by_DD_27
  rq1b_visops_independent_gate:
    status: failed_preserved_by_DD_27
  rq1b2_development:
    status: registered_pending_implementation_and_qualification
    primary_family: answer_hidden_temporal_composition
    qualification_yield:
      paired_low_high_temporal_total_minimum: 75
      paired_low_high_temporal_per_dataset_minimum: 20
      exact_lookup_total_required: 90
      topology_is_secondary_due_to_dataset_support: true
    requirements:
      - temporal_high_complexity_visual_minus_text_at_least_0.05
      - paired_temporal_complexity_interaction_positive
      - visual_repairs_exceed_breaks
  rq1b2_independent_gate:
    status: blocked_until_rq1b2_development_passes
  rq1c_matched_plan:
    status: blocked_until_rq1b2_independent_gate_passes
  rq1d_causal_visual_utilization:
    status: blocked_until_routed_observer_passes
