schema_version: CanvasRCARQ1ConfigV10
protocol_revision: rq1_renderer_qa_v22
status: nibi_requalification_required
execution_enabled: true
seed: 42

unified:
  vllm: configs/vllm_inference.yaml
  segmentation: configs/dataset_segmentation.yaml
  scorer: configs/rca_scorer.yaml

renderer:
  preset: rq0_v6
  required_version: 12
  overrides:
    topology_edge_key: identity_horizontal
    topology_edge_columns: 2
    uniform_detail_font_pt: 9.5
    canvas_aspect: 0.76
    entity_label_mode: case_local_ids
    show_entity_id_explanation: true

experiments:
  legacy_q9:
    task: direct_visops
    stages: 1
    arms: [T, P, V, H]
    question_count: 9
  cross_region:
    task: cross_region_reasoning
    stages: 1
    arms: factorial_16_plus_P_V_H
    reasoning_levels: [1, 2, 3]
  typed_two_stage:
    task: cross_region_reasoning
    stages: 2
    arms: factorial_16_plus_P_V_H
    reasoning_levels: [1, 2, 3]
  direct_rca:
    task: root_cause_direct
    stages: 1
    arms: [T, F, V, P, H, R]
    primary_metric: mrr
    stage_reference: matched_rca
    comparison_role: descriptive_one_stage_reference
  matched_rca:
    task: root_cause_ranking
    stages: 2
    arms: [T, F, V, P, H, R]
    primary_metric: mrr
    primary_comparisons: [[R, T], [R, F]]
    secondary_comparisons: [[V, T], [P, T], [V, P], [H, T], [R, H], [T, F]]
  visual_counterfactual_rca:
    task: root_cause_counterfactual
    stages: 2
    arms: [H_factual, H_targeted, H_placebo, H_neutral]
    primary_metric: cvi
  ledger_handoff_rca:
    task: root_cause_handoff
    stages: 2
    arms: [L_txt, L_vis, L_hyb]
    observer_arm: R
    primary_metric: mrr

data:
  allowed_datasets: [aegislab, aiops2022, aiops2025, re2_ob, re2_tt]
  smoke_datasets: [aegislab, aiops2022, aiops2025]
  frozen_source_manifest: RQs/RQ1/configs/rosters/case_manifest_480_frozen_v1.json
  frozen_eval_adapter: RQs/RQ1/configs/rosters/rq1_frozen_eval_469_adapter_v1.json
  private_roster: RQs/RQ1/configs/rosters/rq1_frozen_eval_469_private_v1.json
  public_roster: RQs/RQ1/configs/rosters/rq1_frozen_eval_469_public_v1.json
  exact_counts: {aegislab: 96, aiops2022: 100, aiops2025: 93, re2_ob: 90, re2_tt: 90}
  headline_datasets: [aegislab, aiops2022, aiops2025]
  saturated_diagnostic_datasets: [re2_ob]
  final_ood_datasets: [re2_tt]
  invalid_cases_are_replaced: false

runtime:
  models: [gemma-4-26b-a4b, qwen3.6-27b]
  max_workers: 4
  request_concurrency: 4
  # 24 shards are approximately one third the size of the previous 8-shard
  # deployment while preserving the frozen roster and case assignments.
  default_shard_count: 24
  result_root: RQs/RQ1/results
  smoke_call_cap: 18
  smoke_timeout_seconds: 600
  gate_call_cap: 36
  gate_timeout_seconds: 1200
  whole_case_infrastructure_exclusion_maximum: 0.05
  parse_rate_minimum: 0.95

# One independent dual-model smoke per experiment. Values select the arm(s)
# run for the single prescribed validation case from each dataset. The static
# suite compiles all arms; these bounded live cells cover distinct transports.
smoke_plans:
  legacy_q9:
    aegislab: [T, P, V, H]
    aiops2022: [T, P, V, H]
    aiops2025: [T, P, V, H]
  cross_region:
    aegislab: [Mt-Rt-Lt-Gt, P]
    aiops2022: [Mv-Rt-Lv-Gt, V]
    aiops2025: [Mv-Rv-Lv-Gv, H]
  typed_two_stage:
    aegislab: [Mt-Rt-Lt-Gt, P]
    aiops2022: [Mv-Rt-Lv-Gt, V]
    aiops2025: [Mv-Rv-Lv-Gv, H]
  direct_rca:
    aegislab: [T]
    aiops2022: [V]
    aiops2025: [R]
  matched_rca:
    aegislab: [T]
    aiops2022: [V]
    aiops2025: [R]
  visual_counterfactual_rca:
    aegislab: [H_factual, H_neutral]
    aiops2022: [H_targeted]
    aiops2025: [H_placebo]
  ledger_handoff_rca:
    aegislab: [L_txt]
    aiops2022: [L_vis]
    aiops2025: [L_hyb]

inference_adapter:
  name: context_safe_output_v1
  version: 1
  max_tokens: 8192
  scope: all_rq1_models_arms_cases_and_stages
  reason: preserve_8192_output_tokens_with_32768_prompt_capacity_in_the_40960_context

visual_diagnostics:
  schema_version: RQ1VisualDiagnosticsV2
  enabled: true
  model_calls_added: 0
  patch_grid: [16, 16]
  metrics: [blank_patch_fraction, evidence_patch_fraction, mean_ink_fraction, region_evidence_patch_fraction]
  ledger_region_selection: true
  attention_artifact_policy: required_same_prefill_qk_probe_for_every_visual_request
  standard_vllm_exposes_attention: false
  custom_vllm_probe_enabled: true
  attention_extra_model_calls: 0
  attention_layer_policy: first_full_attention_after_multimodal_fusion
  attention_is_causal_evidence: false

analysis:
  no_confidence_intervals: true
  paired_test: wilcoxon_pratt
  effect_size: paired_cohens_dz
  rca_minimum_effect: 0.05
  reasoning_effects_are_accuracy_not_rca: true
  counterfactual_cvi_minimum: 0.05
  counterfactual_top1_change_minimum: 0.10
  counterfactual_top5_change_minimum: 0.30
  counterfactual_rank_distance_minimum: 0.10
