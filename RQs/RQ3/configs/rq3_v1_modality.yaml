name: rq3_v1_modality
parent_rq: RQ3
hypothesis: >
  Two questions in one grid.

  (a) RQ3 screening: with decoding held greedy and identical across models, the
  six open-weight candidates separate on AegisLab at n=100. The first bake-off
  could not show this — the Gemma cells ran at temperature 1.0 while the Qwens
  ran greedy, and at n=20 every model's interval overlapped every other's.

  (b) The thesis test: a model given the rendered dashboard plus the evidence
  text (hybrid) outscores the same model given the evidence text alone
  (text_only). If it does not, the dashboard is not carrying information the
  serialised telemetry lacks, and the project's central claim is in question
  regardless of which model wins.

  The gap MRR(hybrid) - MRR(text_only) is also the screening-model selection
  criterion: a model that scores the same without the image cannot separate
  dashboard configurations, whatever its absolute MRR, and is therefore useless
  as the RQ1 grid's workhorse.

  (c) Panel coverage. Measured over all 100 cases, config v0 gives the injected
  service no metric panel on 34 of them. Running the thesis test on a dashboard
  that omits the answer a third of the time would understate the representation
  rather than measure it, so the primary config here is cov30 (30 panels,
  coverage-first with 20 slots reserved for distinct services, 2048px), which
  covers 90%. v0 is retained as a hybrid-only anchor for two reasons: it keeps
  a line of comparability to the committed Sonnet-5 0.797 number, and
  cov30-hybrid vs v0-hybrid is itself a properly powered n=100 A/B of the
  selector -- the question DD-11 tried to settle at n=20, where the power
  analysis says nothing under 0.20 MRR was resolvable.

design_axis: G_modality  # crossed with the RQ3 model panel and axis A' (selection)

variables:
  independent:
    model:
      - gemma-4-e4b
      - gemma-4-12b
      - gemma-4-26b-a4b   # DNF in the first bake-off; retried on a 3600s health
                          # timeout and nothing else. --enforce-eager would skip
                          # the MoE autotune but changes the kernel path and so
                          # the decoding recipe; a model whose numbers came from
                          # a different recipe is not in the same comparison.
      - qwen3.5-4b
      - qwen3.5-9b
      - qwen3.6-27b
      - claude-sonnet-5   # reference arm, Bedrock, no GPU
    modality: [hybrid, image_only, text_only]
    # Four arms per model: cov30 x three modalities, plus v0 hybrid as anchor.
    dashboard_config: [cov30, v0]
  dependent: [mrr, top1, top3, top5, parse_rate, total_tokens, wall_clock_s]
  controlled:
    # Dashboard, held within an arm. cov30 = fingerprint 3c0c0f885d,
    # v0 = 995b40441f (both at RENDERER_VERSION 4).
    ranker: ksigma
    max_per_family: 0
    max_per_service: 0
    layout: small_multiples
    topology: colored
    topology_labels: numbered
    max_topology_nodes: 25
    show_legend_table: true
    shade_fault_window: true
    annotate_extremes: true
    normalize_panels: false
    show_logs: true
    show_traces: true
    # Decoding, identical across every OPEN-WEIGHT model and every arm. This is
    # the correction that makes the comparison a comparison.
    temperature: 0.0
    top_p: 1.0
    seed: 42
    thinking: false
    # Server-side reproducibility, verified on hardware rather than assumed:
    # --generation-config vllm --seed 42
    # --no-enable-prefix-caching --no-enable-chunked-prefill.
    # Without the cache flags two identical gemma-4-e4b runs disagreed on 16 of
    # 20 cases; with them, 0 of 20 and paired sd 0.0000. --enforce-eager was
    # ablated and dropped: it also passes but costs 3.2x wall clock for no gain.
    #
    # THE REFERENCE ARM IS THE EXCEPTION, and it is not a controllable one.
    # Bedrock rejects both temperature and topP for claude-sonnet-5
    # ("`temperature` is deprecated for this model"), so that arm sends neither
    # and cannot be run greedy -- see DD-14. Its replicate band is +/-0.050 MRR
    # at n=100 and is irreducible. Open-model comparisons are exact; every
    # Sonnet number carries that band and must be reported with it.
    renderer_version: 4

dataset:
  tags: [aegislab]
  n_per_dataset: 100
  # AegisLab is the primary screening set (S1): text SOTA 0.679, so it
  # discriminates. RE2-OB/TT are saturated (0.994) and cannot separate anything.
  # AIOPS-2025 (S2, text SOTA 0.390) follows once the screening model is fixed.

model:
  primary: gemma-4-e4b
  comparators: [qwen3.6-27b, gemma-4-12b, qwen3.5-9b, qwen3.5-4b, gemma-4-26b-a4b]
  reference: claude-sonnet-5

seed: 42

decision_rule: >
  Screening model: rank candidates by dashboard sensitivity,
  MRR(hybrid) - MRR(text_only) on cov30, paired by case_id with Wilcoxon
  p < 0.05/6 (Bonferroni across the six open models). Break ties on GPU-hours
  per 100 cases. Report Cohen's d and flag |d| < 0.2 as fragile.

  Selector: adopt cov30 over v0 if cov30-hybrid beats v0-hybrid paired, on the
  same cases and same model. Note in advance what would make this hard to read:
  cov30 changes coverage (66% -> 90%) and density (6.0 -> 20.3 services shown)
  at once, so a null result is ambiguous between "coverage does not help" and
  "the extra density costs what the coverage gains". If it comes out null or
  negative, the follow-up is cov12 (round-robin at the v0 budget, 82% coverage
  at unchanged density), which separates the two.

  No threshold here is inherited. docs/rq1_design.md section 5 adopts a level at
  delta MRR >= +0.03, chosen before anything had measured run-to-run noise. It
  has now been derived (section 5.1): under the stochastic decoding every earlier
  run used it needed ~598 cases and could never have fired on 100; with the
  replicate band at 0.0000 the estimated config-effect sd is ~0.060, making
  +0.03 detectable at n~32. That estimate is a difference of two near-equal
  variances from n=20 and is fragile -- the cov30 vs v0 selector A/B in this
  cell is the first direct measurement of it. Every comparison reports its own
  paired sd and minimum detectable effect alongside the delta.

  Thesis gate: if hybrid does not beat text_only on AegisLab for both the best
  open model and claude-sonnet-5, stop and escalate before starting the RQ1
  grid — no amount of dashboard-design screening repairs a representation that
  carries no information.

  Rank transfer: read descriptively, not inferentially. Spearman over the four
  arms has a floor of p = 0.042 (over three it was 0.167 -- it could not have
  returned a significant result under any outcome, which is why the reference
  arm now mirrors all four). The load-bearing transfer evidence is the paired
  selector A/B, which has n=100 on both models. Weak agreement means screening
  on the open model would mis-rank RQ1 configs and the grid should run on
  Sonnet-5 despite the cost and the +/-0.050 band.

  A run whose summary.json carries an `aborted` key is not a result and is
  excluded from every comparison until re-run.

output_dir: RQs/RQ3/results/rq3_v1_<model>_<config>_<modality>
