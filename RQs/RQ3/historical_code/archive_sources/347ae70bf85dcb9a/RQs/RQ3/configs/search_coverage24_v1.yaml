extends: RQs/RQ3/configs/rq3.yaml
execution_enabled: false
delivery_boundary: train_subset_search_only
solver:
  attention: "off"
budget:
  hard_limit: null
search:
  enabled: true
  stage: development
  max_batch_calls: 48
  concurrency: 4
  wall_seconds: 3600
  cases_per_dataset: 6
  selectors: [ranked_v1, coverage_v1]
  metric_limit: 24
  conditions:
    - {prompt: inherited_v1, request_profile: legacy_v1}
    - {prompt: inherited_v1, request_profile: card_nonthinking_v1}
  render_overrides:
    grid_columns: 12
    grid_rows: 12
  tree:
    axis: y
    ratio: 0.65
    children:
      - {card: EC01}
      - axis: x
        ratio: 0.3333333333333333
        children:
          - {card: EC02}
          - axis: x
            ratio: 0.5
            children: [{card: EC03}, {card: EC04}]
  diagnostic_transport: pure_visual_with_text_candidates
