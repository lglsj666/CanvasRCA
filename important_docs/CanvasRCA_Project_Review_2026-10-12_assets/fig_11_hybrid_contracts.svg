   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16877f" x="37.9584" y="102.006289" transform="rotate(-0 37.9584 102.006289)">TPV · replace topology text</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(37.9584 124.293169)">TEXT: metrics + traces + logs</text>
