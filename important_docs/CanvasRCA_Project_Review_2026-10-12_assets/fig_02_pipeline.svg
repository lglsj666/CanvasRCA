   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203247" x="20.772" y="36.727267" transform="rotate(-0 20.772 36.727267)">The current route: one diagnostic call, all incident evidence in images</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3569a4" x="37.9584" y="100.099153" transform="rotate(-0 37.9584 100.099153)">1  Compile evidence</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(37.9584 117.894761)">Public metrics, traces,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(37.9584 133.555667)">logs and relations</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(37.9584 149.216574)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(37.9584 164.87748)">Preserve source identities</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16877f" x="237.1644" y="100.099153" transform="rotate(-0 237.1644 100.099153)">2  Render graphics</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(237.1644 117.894761)">Registered graphics</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(237.1644 133.555667)">Labels, units, candidates</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(237.1644 149.216574)">and source-linked marks</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8060a7" x="436.3704" y="100.099153" transform="rotate(-0 436.3704 100.099153)">3  Process images</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(436.3704 117.894761)">Frozen visual encoder</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(436.3704 133.555667)">Registered token policy</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(436.3704 149.216574)">(U: uniform selection)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c66a32" x="635.5764" y="100.099153" transform="rotate(-0 635.5764 100.099153)">4  Diagnose once</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(635.5764 117.894761)">Rank five candidates</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(635.5764 133.555667)">and explain the ranking</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(635.5764 149.216574)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(635.5764 164.87748)">No upstream model call</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667789" x="24.678" y="226.29312" transform="rotate(-0 24.678 226.29312)">Audit path</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203247" x="24.678" y="246.47328" transform="rotate(-0 24.678 246.47328)">Source → graphic → image-token maps; exact inputs/outputs; scoring, cost and measured attention</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3569a4" x="426.996" y="276.74352" transform="rotate(-0 426.996 276.74352)">General task / reading / output instructions</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203247" x="24.678" y="296.92368" transform="rotate(-0 24.678 296.92368)">The audit map supports preprocessing and review; it is not an extra incident-specific text input.</text>
