   <g id="text_1">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203247" x="20.772" y="39.466635" transform="rotate(-0 20.772 39.466635)">How the research question changed</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3569a4" x="34.0524" y="92.958481" transform="rotate(-0 34.0524 92.958481)">RQ1 / RQ2</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(34.0524 110.154688)">Representation &amp; selection</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(34.0524 125.388479)"/>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(34.0524 140.622269)">Text, graphics, hybrid inputs;</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(34.0524 155.85606)">which evidence to retain</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(34.0524 203.460208)">Selective relation graphics</text>
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(34.0524 217.96456)">helped in some settings.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8060a7" x="229.3524" y="92.958481" transform="rotate(-0 229.3524 92.958481)">RQ3.1–3.14</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(229.3524 110.154688)">Coverage &amp; organization</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(229.3524 125.388479)"/>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(229.3524 140.622269)">Evidence recovery, binding,</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(229.3524 155.85606)">comparison and summaries</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(229.3524 203.460208)">More evidence or graphics</text>
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(229.3524 217.96456)">did not ensure gains.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c66a32" x="424.6524" y="92.958481" transform="rotate(-0 424.6524 92.958481)">RQ3.15–3.21</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(424.6524 110.154688)">Strong hybrid reference</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(424.6524 125.388479)"/>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(424.6524 140.622269)">Parent–child duration facts,</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(424.6524 155.85606)">marginals, output rules</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(424.6524 203.460208)">Full text + marginal graph</text>
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(424.6524 217.96456)">reached about 0.50 MRR.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #16877f" x="619.9524" y="92.958481" transform="rotate(-0 619.9524 92.958481)">RQ4.1–4.4</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(619.9524 110.154688)">Pure-visual computation</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(619.9524 125.388479)"/>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(619.9524 140.622269)">Token selection, grouping,</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(619.9524 155.85606)">processing and local detail</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(619.9524 203.460208)">Best pure visual: 0.3517.</text>
    <text style="font-weight: 700; font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #203247" transform="translate(619.9524 217.880966)">Strong text: 0.4846.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203247" x="20.772" y="278.73936" transform="rotate(-0 20.772 278.73936)">This is a map of research decisions, not a cumulative accuracy curve: cohorts, prompts and protocols changed.</text>
   </g>
  </g>
 </g>
