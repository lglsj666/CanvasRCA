[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmrca"
version = "0.1.0"
description = "Vision-language models on rendered telemetry dashboards for microservice root cause analysis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["RQs"]
include = ["vlmrca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["RQs"]
filterwarnings = ["ignore::DeprecationWarning"]
