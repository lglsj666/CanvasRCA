[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvasrca"
version = "0.2.0"
description = "Vision-language models on rendered telemetry dashboards for microservice root cause analysis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vlmrca*", "unified_scripts*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
